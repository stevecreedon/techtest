{% extends "base.html" %}

{% block title %}RWS Chat{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  <div class="w-full max-w-2xl bg-gray-100 rounded-lg" data-controller="chat">
    <div
      data-chat-target="messages"
      class="flex flex-col p-4 h-96 overflow-y-auto bg-gray-50 rounded-t-lg border border-gray-200"
    ></div>
    <form
      data-action="submit->chat#send"
      class="flex gap-2 p-4 border-t border-gray-200 bg-white rounded-b-lg"
    >
      <input
        data-chat-target="input"
        type="text"
        name="message"
        placeholder="Type a message..."
        autocomplete="off"
        class="flex-1 rounded border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400"
      />
      <button
        type="submit"
        class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600"
      >
        Send
      </button>
    </form>
  </div>
</div>
{% endblock %}
